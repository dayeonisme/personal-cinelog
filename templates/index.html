<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinelog</title>
<link rel="stylesheet" href="/static/css/style.css?v=20260613">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<!-- ── GNB ────────────────────────────────────────────────── -->
<nav class="gnb">
  <div class="gnb-logo">
    <span class="logo-text"><em>Cinelog</em></span>
  </div>
  <div class="gnb-buttons">
    <button class="gnb-btn active" data-page="home">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="19" stroke-width="1.5"/>
        <path d="M20 9L8 19.5V32H16V24H24V32H32V19.5L20 9Z" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      <span>홈</span>
    </button>
    <button class="gnb-btn" data-page="review">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="19" stroke-width="1.5"/>
        <path d="M13 28L13 17" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M13 13L13 12" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M11 17 Q13 14 15 17" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <path d="M17 15 L28 15" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M17 20 L28 20" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M17 25 L24 25" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span>평가</span>
    </button>
    <button class="gnb-btn" data-page="watchlist">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="19" stroke-width="1.5"/>
        <path d="M20 10 L22.5 16 L29 16.5 L24 21 L26 28 L20 24 L14 28 L16 21 L11 16.5 L17.5 16 Z" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      <span>보고싶어요</span>
    </button>
  </div>
  <div class="lang-toggle" aria-label="영화 정보 표시 언어">
    <button class="lang-toggle-btn active" data-lang="ko" type="button">KR</button>
    <button class="lang-toggle-btn" data-lang="en" type="button">EN</button>
  </div>
</nav>

<!-- ── MAIN ──────────────────────────────────────────────── -->
<main class="main-content">

  <!-- HOME PAGE -->
  <div id="page-home" class="page active">
    <div class="page-header">
      <h1 class="page-title">홈</h1>
      <div class="search-bar-wrap">
        <select id="home-search-field" class="search-field-select">
          <option value="all">통합검색</option>
          <option value="title">영화명</option>
          <option value="director">감독명</option>
          <option value="actor">배우명</option>
          <option value="hashtag">해시태그</option>
        </select>
        <input id="home-search-input" type="text" placeholder="검색어를 입력하세요..." class="search-input">
        <button id="home-search-btn" class="search-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
      </div>
      <div class="toolbar">
        <div class="filter-group">
          <button class="filter-btn active" data-filter="all">전체</button>
          <button class="filter-btn" data-filter="review">평가</button>
          <button class="filter-btn" data-filter="watchlist">보고싶어요</button>
        </div>
        <select id="home-sort" class="sort-select">
          <option value="newest">최신순</option>
          <option value="oldest">오래된순</option>
          <option value="rating_high">평점 높은순</option>
          <option value="rating_low">평점 낮은순</option>
        </select>
      </div>
    </div>
    <div id="home-grid" class="movie-grid"></div>
    <div id="home-loading" class="loading-indicator" style="display:none">로딩 중...</div>
  </div>

  <!-- REVIEW PAGE -->
  <div id="page-review" class="page">
    <div class="page-header">
      <h1 class="page-title">평가</h1>
      <div class="search-bar-wrap">
        <select id="review-search-field" class="search-field-select">
          <option value="all">통합검색</option>
          <option value="director">감독명</option>
          <option value="actor">배우명</option>
          <option value="title">영화명</option>
          <option value="rating_name">별점명</option>
          <option value="comment_name">코멘트명</option>
          <option value="hashtag">해시태그</option>
        </select>
        <input id="review-search-input" type="text" placeholder="검색어를 입력하세요..." class="search-input">
        <button id="review-search-btn" class="search-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
      </div>
      <div class="toolbar">
        <div class="filter-group">
          <button class="filter-btn active" data-filter="all">전체</button>
          <button class="filter-btn" data-filter="completed">완료</button>
          <button class="filter-btn" data-filter="in_progress">진행중</button>
          <button class="filter-btn" data-filter="stopped">중단</button>
        </div>
        <select id="review-sort" class="sort-select">
          <option value="newest">최신순</option>
          <option value="oldest">오래된순</option>
          <option value="rating_high">평점 높은순</option>
          <option value="rating_low">평점 낮은순</option>
        </select>
      </div>
    </div>
    <div id="review-list" class="entry-list"></div>
    <div id="review-loading" class="loading-indicator" style="display:none">로딩 중...</div>
    <div id="review-load-more" class="load-more" style="display:none">
      <button onclick="loadMoreReviews()">더 보기</button>
    </div>
    <button class="fab" id="review-fab" title="평가 등록">+</button>
  </div>

  <!-- WATCHLIST PAGE -->
  <div id="page-watchlist" class="page">
    <div class="page-header">
      <h1 class="page-title">보고싶어요</h1>
      <div class="search-bar-wrap">
        <select id="watchlist-search-field" class="search-field-select">
          <option value="all">통합검색</option>
          <option value="director">감독명</option>
          <option value="actor">배우명</option>
          <option value="title">영화명</option>
          <option value="comment_name">코멘트명</option>
          <option value="hashtag">해시태그</option>
        </select>
        <input id="watchlist-search-input" type="text" placeholder="검색어를 입력하세요..." class="search-input">
        <button id="watchlist-search-btn" class="search-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
      </div>
      <div class="toolbar">
        <div class="filter-group">
          <button class="filter-btn active" data-filter="all">전체</button>
          <button class="filter-btn" data-filter="wish">보고싶어요</button>
          <button class="filter-btn" data-filter="rewatch">다시 보고싶어요</button>
        </div>
        <select id="watchlist-sort" class="sort-select">
          <option value="newest">최신순</option>
          <option value="oldest">오래된순</option>
        </select>
      </div>
    </div>
    <div id="watchlist-list" class="entry-list"></div>
    <div id="watchlist-loading" class="loading-indicator" style="display:none">로딩 중...</div>
    <div id="watchlist-load-more" class="load-more" style="display:none">
      <button onclick="loadMoreWatchlist()">더 보기</button>
    </div>
    <button class="fab" id="watchlist-fab" title="보고싶어요 등록">+</button>
  </div>

  <!-- MOVIE DETAIL PAGE -->
  <div id="page-movie" class="page">
    <div class="register-header">
      <button class="back-btn" id="movie-back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        돌아가기
      </button>
    </div>
    <div id="movie-detail-content"></div>
  </div>

  <!-- REGISTER PAGE -->
  <div id="page-register" class="page">
    <div class="register-header">
      <button class="back-btn" id="register-back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        돌아가기
      </button>
      <h2 id="register-title">영화 등록</h2>
    </div>

    <!-- Step 1 -->
    <div id="step-1" class="register-step active">
      <div class="step-indicator">
        <span class="step-dot active">1</span>
        <span class="step-line"></span>
        <span class="step-dot">2</span>
      </div>
      <h3 class="step-title">영화 검색</h3>
      <div class="movie-search-box">
        <input id="reg-movie-search" type="text" placeholder="영화 제목을 입력하세요..." class="search-input big">
        <button id="reg-movie-search-btn" class="primary-btn">검색</button>
      </div>
      <div id="reg-search-results" class="search-results"></div>
      <div id="reg-selected-movie" class="selected-movie" style="display:none">
        <div class="selected-movie-poster">
          <img id="reg-poster" src="" alt="">
        </div>
        <div class="selected-movie-info">
          <h3 id="reg-title"></h3>
          <p id="reg-year-director"></p>
          <p id="reg-actors" class="muted"></p>
          <p id="reg-genre" class="muted"></p>
          <button id="reg-reselect-btn" class="ghost-btn small">다시 선택</button>
        </div>
      </div>
      <button id="step1-next-btn" class="primary-btn next-btn" disabled>다음 단계 →</button>
    </div>

    <!-- Step 2 -->
    <div id="step-2" class="register-step">
      <div class="step-indicator">
        <span class="step-dot done">✓</span>
        <span class="step-line active"></span>
        <span class="step-dot active">2</span>
      </div>

      <div id="watch-status-section" class="form-section">
        <h3 class="step-title">감상 상태</h3>
        <div class="status-selector">
          <button class="status-btn active" data-status="completed">완료</button>
          <button class="status-btn" data-status="in_progress">진행중</button>
          <button class="status-btn" data-status="stopped">중단</button>
        </div>
      </div>

      <div class="form-section">
        <h3 class="step-title">해시태그</h3>
        <div class="hashtag-editor">
          <div class="hashtag-chips" id="hashtag-chips"></div>
          <div class="hashtag-input-wrap">
            <input type="text" id="hashtag-input" class="hashtag-input" placeholder="해시태그를 입력하고 Enter (과거 등록한 태그는 자동완성)" autocomplete="off">
            <div class="hashtag-dropdown" id="hashtag-dropdown" style="display:none"></div>
          </div>
        </div>
      </div>

      <div id="ratings-section" class="form-section">
        <h3 class="step-title">별점</h3>
        <div id="ratings-modules"></div>
        <button class="add-module-btn" id="add-rating-btn">+ 별점 추가</button>
      </div>

      <div class="form-section">
        <h3 class="step-title">코멘트</h3>
        <div id="comments-modules"></div>
        <button class="add-module-btn" id="add-comment-btn">+ 코멘트 추가</button>
      </div>

      <div class="register-actions">
        <button class="ghost-btn" id="step2-back-btn">← 이전</button>
        <button class="primary-btn" id="submit-entry-btn">등록하기</button>
      </div>
    </div>
  </div>

</main>

<!-- MODALS -->
<div id="modal-delete" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <h3>삭제하시겠습니까?</h3>
    <p class="muted">이 작업은 되돌릴 수 없습니다.</p>
    <div class="modal-actions">
      <button class="ghost-btn" id="modal-delete-cancel">취소</button>
      <button class="danger-btn" id="modal-delete-confirm">삭제</button>
    </div>
  </div>
</div>

<div id="modal-name-error" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <h3>사용할 수 없는 이름</h3>
    <p class="muted">기본 이름(평점, 감상평)과 동일한 이름은 커스텀으로 등록할 수 없습니다.</p>
    <div class="modal-actions">
      <button class="primary-btn" id="modal-name-error-close">확인</button>
    </div>
  </div>
</div>

<script src="/static/js/app.js?v=20260613"></script>
</body>
</html>
